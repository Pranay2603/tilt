services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tilt
      POSTGRES_PASSWORD: tilt
      POSTGRES_DB: tilt
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tilt"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    # appendonly keeps queued events across a restart; noeviction makes Redis refuse writes
    # instead of silently dropping a visitor's assignment when memory runs out.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
