services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tilt
      POSTGRES_PASSWORD: tilt
      POSTGRES_DB: tilt
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tilt"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
